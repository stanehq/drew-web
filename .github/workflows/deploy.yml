name: Deploy

# Builds the container image and runs it on the VPS next to the bot.
# Needs these in the "production" GitHub Environment:
#   secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, WEB_ENV_FILE (the .env contents)
# The image and deploy jobs only run once the repository variable
# VPS_DEPLOY is set to "true", so merging this does nothing until the VPS is ready.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  build-check:
    name: Build
    uses: ./.github/workflows/build.yml

  image:
    name: Build and push image
    needs: [quality, build-check]
    if: ${{ vars.VPS_DEPLOY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign image (keyless, OIDC)
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

  deploy:
    name: Deploy to VPS
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull the pinned image and restart the website
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          ENV_FILE: ${{ secrets.WEB_ENV_FILE }}
          GH_API_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_DIGEST,ENV_FILE,GH_API_TOKEN,GHCR_TOKEN,GITHUB_REPOSITORY,GITHUB_ACTOR,DEPLOY_SHA
          script: |
            set -Eeuo pipefail

            : "${ENV_FILE:?GitHub Environment secret WEB_ENV_FILE is empty or unavailable}"
            : "${IMAGE_DIGEST:?Build did not produce an image digest}"

            case "$GITHUB_REPOSITORY" in
              stanehq/drew-web) ;;
              *) echo "Unexpected repository: $GITHUB_REPOSITORY" >&2; exit 1 ;;
            esac
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit SHA." >&2; exit 1; }

            # The bot's deployment creates this network and runs Caddy on it.
            if ! sudo docker network inspect drew-edge >/dev/null 2>&1; then
              echo "Network drew-edge does not exist. Deploy the bot (Caddy) first." >&2
              exit 1
            fi

            install -d -m 0750 "$HOME/drew-web"
            curl --fail --show-error --silent --location --retry 3 \
              --header "Authorization: Bearer ${GH_API_TOKEN}" \
              --header "Accept: application/vnd.github.raw+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/deploy/compose.yaml?ref=${DEPLOY_SHA}" \
              --output "$HOME/drew-web/compose.yaml"
            unset GH_API_TOKEN

            cd "$HOME/drew-web"
            umask 077
            printf '%s' "$ENV_FILE" > .env
            chmod 600 .env
            unset ENV_FILE

            IMAGE_REF="ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST"
            printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io \
              --username "$GITHUB_ACTOR" --password-stdin >/dev/null
            sudo env WEB_IMAGE="$IMAGE_REF" docker compose -f compose.yaml pull web
            sudo docker logout ghcr.io >/dev/null
            unset GHCR_TOKEN

            sudo env WEB_IMAGE="$IMAGE_REF" docker compose -f compose.yaml up -d web

            for attempt in $(seq 1 60); do
              HEALTH="$(sudo docker inspect --format '{{.State.Health.Status}}' drew-web 2>/dev/null || true)"
              [ "$HEALTH" = "healthy" ] && { echo "drew-web is healthy."; break; }
              sleep 2
            done
            if [ "$HEALTH" != "healthy" ]; then
              echo "drew-web did not become healthy." >&2
              sudo docker logs --tail 50 drew-web >&2 || true
              exit 1
            fi

            sudo docker image prune -f >/dev/null
