name: TEMP Generate npm lockfile

on:
  push:
    branches:
      - chore/runtime-policy-2026-11
    paths:
      - .github/workflows/temporary-generate-npm-lockfile.yml

permissions:
  contents: write

concurrency:
  group: temporary-npm-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock.json changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): add reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
