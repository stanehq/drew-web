# Drew website on the same VPS as the bot, in its own container.
#
# The bot's compose project creates the shared "drew-edge" network and runs
# Caddy, which terminates HTTPS for drewbot.xyz and forwards to this service.
# This container publishes no port to the host.
name: drew-web

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set by the deployment workflow}
    container_name: drew-web
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: drew-edge
